<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lantern Homeschool: a free, self-paced grades 1-12 homeschool with video lessons, quizzes, progress tracking and a parent portal.">
<meta name="theme-color" content="#1E4D3B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='14' fill='%23F2B21B' opacity='.35'/%3E%3Ccircle cx='16' cy='17' r='8' fill='%23F2B21B'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lantern Homeschool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: a calm "study desk" — pine-ink type on faintly ruled paper, one lamp-yellow glow
   for progress, and four subject colors used like binder tabs. */
:root {
  --paper: #F5F7F2; --sheet: #FFFFFF; --rule: #DDE3DC; --ink: #17241E; --ink-2: #4E5C55; --ink-3: #7A867F;
  --pine: #1E4D3B; --pine-ink: #FFFFFF; --lamp: #F2B21B; --lamp-soft: #FFF2CC;
  --math: #3461C1; --ela: #C2453A; --sci: #2F8A57; --soc: #7B4FA6; --ai: #0E7C86; --fin: #B7791F; --other: #8A7A55;
  --good: #2F8A57; --warn: #B7791F; --bad: #C2453A; --good-bg: #E3F2E8; --bad-bg: #FBE6E3;
  --shadow: 0 1px 2px rgba(23,36,30,.06), 0 6px 20px rgba(23,36,30,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111814; --sheet: #18221D; --rule: #2B3A33; --ink: #E7EEE9; --ink-2: #AEBBB4; --ink-3: #82918A;
  --pine: #8FD3B0; --pine-ink: #0E1A14; --lamp: #F5C14A; --lamp-soft: #3A3018;
  --math: #7FA3F0; --ela: #F08A7E; --sci: #6CCB95; --soc: #B796E0; --ai: #5CCFD6; --fin: #E8B45A; --other: #C9B98E;
  --good: #6CCB95; --warn: #E8B45A; --bad: #F08A7E; --good-bg: #183A28; --bad-bg: #44201C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #111814; --sheet: #18221D; --rule: #2B3A33; --ink: #E7EEE9; --ink-2: #AEBBB4; --ink-3: #82918A;
  --pine: #8FD3B0; --pine-ink: #0E1A14; --lamp: #F5C14A; --lamp-soft: #3A3018;
  --math: #7FA3F0; --ela: #F08A7E; --sci: #6CCB95; --soc: #B796E0; --ai: #5CCFD6; --fin: #E8B45A; --other: #C9B98E;
  --good: #6CCB95; --warn: #E8B45A; --bad: #F08A7E; --good-bg: #183A28; --bad-bg: #44201C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--rule) 45%, transparent) 31px 32px); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 700; } h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--math); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); } .small { font-size: .875rem; }
.lede { color: var(--ink-2); font-size: 1.05rem; max-width: 62ch; }
.eyebrow { font: 700 .75rem/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.eyebrow.math { color: var(--math); } .eyebrow.ela { color: var(--ela); } .eyebrow.sci { color: var(--sci); } .eyebrow.soc { color: var(--soc); }
.num { font-variant-numeric: tabular-nums; }

/* shell */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 20px; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-name { font: 800 1.05rem/1.1 var(--f-display); }
.brand-sub { font-size: .75rem; color: var(--ink-3); }
.lamp { width: 26px; height: 26px; border-radius: 50%; flex: none; background: radial-gradient(circle at 50% 55%, var(--lamp) 0 38%, color-mix(in srgb, var(--lamp) 35%, transparent) 39% 62%, transparent 63%); }
.lamp.big { width: 64px; height: 64px; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.9); opacity: .7; } }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.chip { font-size: .8rem; padding: 4px 10px; border-radius: 99px; background: var(--lamp-soft); color: var(--ink); font-variant-numeric: tabular-nums; }
.parent-chip { background: var(--pine); color: var(--pine-ink); font-weight: 700; }
main.wrap { max-width: 1100px; margin: 0 auto; padding-block: 24px 64px; padding-inline: 20px; display: grid; gap: 22px; }
main.narrow { max-width: 640px; margin: 0 auto; padding-block: 32px 64px; padding-inline: 20px; display: grid; gap: 18px; }
.center-screen { min-height: 60vh; display: grid; place-items: center; align-content: center; gap: 14px; }
.banner { padding: 10px 14px; border-radius: 10px; background: var(--lamp-soft); border: 1px solid color-mix(in srgb, var(--lamp) 50%, transparent); font-size: .9rem; }
.sec { margin-top: 6px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 1.5px solid transparent; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .08s, background .15s; min-height: 44px; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--pine); color: var(--pine-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--pine) 88%, var(--ink)); }
.btn.primary[disabled] { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; border-color: var(--rule); color: var(--ink); }
.btn.ghost:hover { background: var(--sheet); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.sm { padding: 7px 13px; font-size: .9rem; min-height: 38px; } .btn.xs { padding: 4px 9px; font-size: .8rem; min-height: 30px; }
.back { justify-self: start; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* cards & forms */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.form { display: grid; gap: 10px; }
.form h3 { margin-bottom: 4px; }
label, .label { font-size: .85rem; font-weight: 700; color: var(--ink-2); display: block; margin-bottom: 4px; }
input:not([type=checkbox]), select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--paper); min-height: 44px; }
input:focus, select:focus { border-color: var(--pine); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--lamp) 45%, transparent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row4 { display: grid; grid-template-columns: 160px 1fr 110px 2fr; gap: 12px; }
.row2 > *, .row4 > * { min-width: 0; }
@media (max-width: 720px) { .row2, .row4 { grid-template-columns: 1fr; } }
.check { display: flex; align-items: center; gap: 8px; font-weight: 400; color: var(--ink); }
.check input { width: 20px; height: 20px; accent-color: var(--pine); }
.hint { font-size: .85rem; color: var(--ink-3); }
.err { color: var(--bad); font-size: .9rem; min-height: 1.2em; }
.err:empty { min-height: 0; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--sheet); background: var(--sw); box-shadow: 0 0 0 1px var(--rule); cursor: pointer; }
.swatch.on { box-shadow: 0 0 0 3px var(--ink); }

/* setup */
.setup-head { display: grid; gap: 10px; justify-items: start; }
.steps { list-style: none; padding: 0; margin: 0; display: flex; gap: 8px; counter-reset: s; flex-wrap: wrap; }
.steps li { counter-increment: s; font-size: .85rem; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--rule); color: var(--ink-3); }
.steps li::before { content: counter(s) "  "; font-weight: 700; }
.steps li.on { background: var(--pine); color: var(--pine-ink); border-color: var(--pine); }
.steps li.done { color: var(--good); border-color: var(--good); }
.kid-list { list-style: none; padding: 0; margin: 0; display: flex; gap: 10px; flex-wrap: wrap; }
.kid-list li { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 99px; background: var(--sheet); border: 1px solid var(--rule); }

/* avatars */
.avatar { --av: #3461C1; width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; background: var(--av); color: #fff; font: 800 .95rem/1 var(--f-display); letter-spacing: .02em; }
.avatar.sm { width: 30px; height: 30px; font-size: .75rem; }
.avatar.xl { width: 92px; height: 92px; font-size: 2rem; box-shadow: 0 0 0 6px color-mix(in srgb, var(--av) 18%, transparent); }
.parent-av { --av: var(--pine); background: var(--pine); }
.key { width: 34px; height: 34px; border: 5px solid var(--pine-ink); border-radius: 50%; position: relative; }
.key::after { content: ""; position: absolute; left: 50%; top: 100%; width: 5px; height: 20px; margin-left: -2.5px; background: var(--pine-ink); border-radius: 2px; }

/* picker */
.picker-title { text-align: center; margin-top: 18px; }
.picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
.pick { display: grid; justify-items: center; gap: 8px; padding: 26px 14px 20px; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 18px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
.pick:hover { transform: translateY(-3px); border-color: var(--pine); }
.pick-name { font: 800 1.15rem var(--f-display); }
.pick-sub { font-size: .85rem; color: var(--ink-2); }
.pick.parent { background: color-mix(in srgb, var(--pine) 8%, var(--sheet)); }

/* pin */
.pin-screen { max-width: 360px; margin: 0 auto; padding-block: 36px 64px; padding-inline: 20px; display: grid; justify-items: center; gap: 12px; text-align: center; }
.dots { display: flex; gap: 14px; margin: 6px 0; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-3); }
.dots i.f { background: var(--pine); border-color: var(--pine); }
.shake { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
.key-btn { width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--sheet); font: 700 1.5rem var(--f-display); cursor: pointer; box-shadow: var(--shadow); }
.key-btn:active { background: var(--lamp-soft); }
.key-btn.del { font-size: 1.2rem; }
.pin-foot { display: flex; gap: 10px; margin-top: 8px; }
.forgot { text-align: left; width: 100%; }

/* rings & bars */
.ring { position: relative; width: 92px; height: 92px; flex: none; }
.ring.lg { width: 168px; height: 168px; } .ring.sm { width: 64px; height: 64px; }
.ring svg { width: 100%; height: 100%; display: block; }
.ring-bg { fill: none; stroke: var(--rule); stroke-width: 9; }
.ring-fg { fill: none; stroke: var(--lamp); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.ring-num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-num b { font: 800 1.15rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.ring.lg .ring-num b { font-size: 2.3rem; } .ring.sm .ring-num b { font-size: .9rem; }
.ring-num small { font-size: .7rem; color: var(--ink-3); margin-top: 3px; } .ring.sm .ring-num small { display: none; }
.bar { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--rule) 70%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--pine); transition: width .6s ease; }
.bar.math i { background: var(--math); } .bar.ela i { background: var(--ela); } .bar.sci i { background: var(--sci); } .bar.soc i { background: var(--soc); } .bar.other i, .bar.read i, .bar.pe i, .bar.art i, .bar.field i, .bar.life i { background: var(--other); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.dot.math { background: var(--math); } .dot.ela { background: var(--ela); } .dot.sci { background: var(--sci); } .dot.soc { background: var(--soc); }

/* learner home */
.hero-card { display: flex; gap: 28px; align-items: center; background: var(--sheet); border: 1px solid var(--rule); border-radius: 22px; padding: 26px; box-shadow: var(--shadow); flex-wrap: wrap; }
.hero-text { display: grid; gap: 10px; flex: 1; min-width: 240px; }
.stat-row { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 4px; }
.stat b { display: block; font: 800 1.35rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat small { color: var(--ink-3); font-size: .8rem; }
.grade-switch { display: flex; align-items: center; gap: 10px; max-width: 280px; }
.grade-switch label { margin: 0; }
.subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.subj { --c: var(--math); position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 18px 16px; display: grid; gap: 10px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.subj::before { content: ""; position: absolute; top: 0; right: 18px; width: 34px; height: 9px; border-radius: 0 0 6px 6px; background: var(--c); }
.subj.ela { --c: var(--ela); } .subj.sci { --c: var(--sci); } .subj.soc { --c: var(--soc); }
.subj-top { display: flex; justify-content: space-between; align-items: baseline; }
.subj-tag { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.subj-pct { font: 800 1.4rem var(--f-display); font-variant-numeric: tabular-nums; }
.subj-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.subj-actions .btn.primary { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: inline-block; }
.next-u { font-weight: 400; }
.done-pill { font-size: .85rem; font-weight: 700; color: var(--good); }
.subj-actions .btn.ghost { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: inline-block; }
.bonus-tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); border: 1px solid var(--warn); vertical-align: middle; }
.subj-top .bonus-tag { margin-right: auto; margin-left: 8px; }
.subj.is-bonus { border-style: dashed; }
.sb.is-bonus { opacity: .75; }
tr.is-bonus td { color: var(--ink-3); }
.plan-card .check { display: block; margin: 8px 0; }
#s-goal-row[hidden] { display: none; }
.detail li .btn.xs { margin-left: 6px; }
.badges { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { display: grid; gap: 2px; justify-items: center; text-align: center; padding: 14px 10px; border-radius: 12px; border: 1px dashed var(--rule); color: var(--ink-3); }
.badge .medal { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--rule); margin-bottom: 6px; }
.badge b { font-size: .9rem; } .badge small { font-size: .75rem; }
.badge.on { border-style: solid; background: var(--sheet); color: var(--ink); box-shadow: var(--shadow); }
.badge.on .medal { border-color: var(--lamp); background: radial-gradient(circle, var(--lamp) 0 45%, var(--lamp-soft) 46%); }

/* course & lesson */
.course-head { display: grid; gap: 8px; }
.course-meta { display: grid; grid-template-columns: minmax(120px, 320px) auto; gap: 12px; align-items: center; font-size: .9rem; color: var(--ink-2); }
@media (max-width: 560px) { .course-meta { grid-template-columns: 1fr; } }
.units { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.unit-btn { width: 100%; display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 14px 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; cursor: pointer; }
.unit-btn:hover { border-color: var(--pine); }
.unit-n { font-size: .8rem; color: var(--ink-3); font-weight: 700; }
.unit-t { font-weight: 700; min-width: 0; }
@media (max-width: 560px) { .unit-btn { grid-template-columns: 1fr; gap: 4px; } }
.pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: color-mix(in srgb, var(--rule) 55%, transparent); color: var(--ink-2); white-space: nowrap; justify-self: start; }
.pill.mastered { background: var(--good-bg); color: var(--good); }
.pill.trying { background: var(--lamp-soft); color: var(--ink); }
.pill.open { background: color-mix(in srgb, var(--math) 14%, transparent); color: var(--math); }
.resources ul, .res-list { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.ext::after { content: " ↗"; }
.lesson-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 20px; padding: clamp(20px, 4vw, 36px); box-shadow: var(--shadow); display: grid; gap: 14px; max-width: 780px; }
.mini { font-size: .8rem; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); margin-top: 10px; }
.points { margin: 0; padding-left: 22px; display: grid; gap: 10px; font-size: 1.08rem; max-width: 65ch; }
.points li::marker { color: var(--lamp); font-weight: 800; }
.try { background: var(--lamp-soft); border-radius: 12px; padding: 14px 16px; }
.try b { display: block; font-family: var(--f-display); margin-bottom: 2px; }
.quiz-cta { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px dashed var(--rule); padding-top: 16px; }
.lesson-nav { display: flex; justify-content: space-between; max-width: 780px; }

/* quiz */
.quiz { max-width: 760px; }
.quiz-head { display: grid; gap: 8px; }
.q-progress { font-size: .9rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.q-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 20px; padding: clamp(18px, 4vw, 32px); box-shadow: var(--shadow); display: grid; gap: 16px; }
.q-text { font-size: clamp(1.25rem, 1rem + 1vw, 1.6rem); font-weight: 700; }
.choices { display: grid; gap: 10px; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--paper); cursor: pointer; font-size: 1.05rem; min-height: 54px; }
.choice:hover:not([disabled]) { border-color: var(--pine); }
.choice .letter { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--sheet); border: 1px solid var(--rule); font-weight: 700; font-size: .85rem; }
.choice[disabled] { cursor: default; }
.choice.right { border-color: var(--good); background: var(--good-bg); }
.choice.right .letter { background: var(--good); color: #fff; border-color: var(--good); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice.wrong .letter { background: var(--bad); color: #fff; border-color: var(--bad); }
.feedback { font-weight: 700; padding: 10px 14px; border-radius: 10px; }
.feedback.ok { background: var(--good-bg); color: var(--good); } .feedback.no { background: var(--bad-bg); color: var(--bad); }
.q-actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.result-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 22px; padding: 32px 24px; display: grid; justify-items: center; text-align: center; gap: 14px; box-shadow: var(--shadow); max-width: 640px; margin: 0 auto; }
.result-card .actions { justify-content: center; }
.result-card.retry .ring-fg { stroke: var(--warn); }

/* parent */

/* video lessons: a chalkboard that looks the same in light and dark themes */
:root { --board: #1D3A2F; --board-2: #142A21; --chalk: #F3F1E7; --chalk-2: #C3CEC6; --chalk-lamp: #F5C14A; }

  background: radial-gradient(120% 90% at 18% 8%, rgba(255,255,255,.07), transparent 60%), var(--board); box-shadow: inset 0 0 0 6px rgba(0,0,0,.18); }
.chalk-deco i { position: absolute; border-radius: 50%; border: 3px solid var(--c); opacity: .22; animation: drift 9s ease-in-out infinite alternate; }
.chalk-deco i:nth-child(1) { width: 130px; height: 130px; right: -34px; top: -34px; }

.vlamp { width: clamp(56px, 10vw, 92px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 55%, var(--chalk-lamp) 0 36%, rgba(245,193,74,.35) 37% 62%, transparent 63%); }
.vtext { font: 700 clamp(1.05rem, .75rem + 1.6vw, 1.85rem)/1.42 var(--f-body); color: var(--chalk); max-width: 42ch; margin-top: 8px; }

.dots3 i:nth-child(2) { animation-delay: .2s; } .dots3 i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }

@keyframes pop { from { transform: scale(.8); opacity: 0; } }

.vcheck::after { content: ""; position: absolute; left: 23px; top: 13px; width: 14px; height: 27px; border: solid var(--board); border-width: 0 5px 5px 0; transform: rotate(45deg); }

.vbtn:hover, .vtoggle:hover { background: rgba(255,255,255,.08); }

@media (max-width: 560px) { .vpoint { grid-template-columns: 1fr; gap: 6px; } .vnum { font-size: 2.4rem; } .vlamp { width: 48px; } .vlbl { display: none; } .unit-btn { grid-template-columns: 1fr; } }

.lab-mode { font: inherit; font-weight: 700; font-size: .9rem; padding: 8px 12px; border-radius: 99px; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; min-height: 40px; }
.lab-mode.on { background: var(--ai); border-color: var(--ai); color: #fff; } .lab-mode:disabled { opacity: .45; cursor: not-allowed; }
.lab-body { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; }
@media (max-width: 620px) { .lab-body { grid-template-columns: 1fr; } }
.lab-pad { width: min(240px, 100%); aspect-ratio: 1; display: block; background: #FFFFFF; border: 2px solid var(--rule); border-radius: 14px; touch-action: none; cursor: crosshair;
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px); background-size: 30px 30px; }
.lab-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.lab-side { display: grid; gap: 12px; min-width: 0; }
.lab-check { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-weight: 700; }
.lab-acc { margin: 0; } .lab-set p { margin: 0 0 4px; }
.lab-thumbs { display: flex; flex-wrap: wrap; gap: 4px; min-height: 34px; }
.lab-thumb { width: 32px; height: 32px; image-rendering: pixelated; background: #FFFFFF; border: 1px solid var(--rule); border-radius: 6px; }
/* ── Lumi tutor ── */
.lumi-wrap.sm { width: 34px; height: 42px; }
.lumi-fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 40; display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 8px;
  border-radius: 99px; border: 0; background: var(--pine); color: var(--pine-ink); font: 700 1rem var(--f-body); box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; min-height: 52px; }
.lumi-fab:hover { transform: translateY(-1px); }
.lumi-panel { position: fixed; right: 16px; bottom: 16px; z-index: 60; width: min(400px, calc(100vw - 32px)); max-height: min(620px, calc(100vh - 32px)); display: flex; flex-direction: column;
  background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.3); overflow: hidden; }
.lp-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--rule); background: var(--lamp-soft); } .lp-head > div { flex: 1; min-width: 0; }
.lp-head .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.lp-msg { margin: 0; padding: 9px 12px; border-radius: 14px; max-width: 88%; white-space: pre-wrap; line-height: 1.45; }
.lp-msg.bot { background: var(--paper); border: 1px solid var(--rule); align-self: flex-start; border-bottom-left-radius: 4px; }
.lp-msg.me { background: var(--pine); color: var(--pine-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
.lp-msg.err { background: var(--bad-bg); color: var(--bad); border-color: transparent; } .lp-msg.think { --c: var(--ink-3); color: var(--ink-3); }
.lp-chips { display: flex; gap: 6px; padding: 0 12px 8px; overflow-x: auto; }
.chip-btn { flex: none; font: inherit; font-size: .82rem; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; }
.chip-btn:disabled { opacity: .5; cursor: not-allowed; }
.lp-form { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--rule); align-items: end; }
.lp-form textarea { flex: 1; resize: none; font: inherit; padding: 8px 10px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--paper); color: var(--ink); }
.lp-foot { margin: 0; padding: 0 12px 10px; font-size: .75rem; color: var(--ink-3); }
.lt-log { list-style: none; padding: 0; display: grid; gap: 10px; } .lt-log li p { margin: 4px 0; } .lt-kids { border: 0; padding: 0; margin: 8px 0; display: grid; gap: 6px; }
@media (max-width: 520px) { .lumi-panel { right: 8px; left: 8px; bottom: 8px; width: auto; max-height: calc(100vh - 16px); } }
#app:has(.lumi-fab) main { padding-bottom: 96px; }

body[data-kidtheme] .sec { display: inline-block; background: var(--sheet); color: var(--ink); padding: 4px 14px; border-radius: 99px; box-shadow: var(--shadow); }
body[data-kidtheme] .course-head, body[data-kidtheme] .quiz-head { background: var(--sheet); padding: 16px 18px; border-radius: var(--r); box-shadow: var(--shadow); }

body[data-kidtheme] .badge, body[data-kidtheme] .unit-btn { background: var(--sheet); }
body[data-kidtheme] .banner { box-shadow: var(--shadow); }
/* theme picker */
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; list-style: none; padding: 0; }
.theme-card { position: relative; display: grid; gap: 6px; padding: 8px 8px 10px; border-radius: 14px; border: 2px solid var(--rule); background: var(--sheet); color: var(--ink); font: inherit; text-align: left; cursor: pointer; width: 100%; }
.theme-card.on { border-color: var(--lamp); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lamp) 40%, transparent); }
.theme-card:disabled { cursor: default; }
.theme-card .sw { display: block; height: 72px; border-radius: 10px; position: relative; overflow: hidden; }
.theme-card .sw::before { content: ""; position: absolute; inset: 0; }
.theme-card.locked .sw { filter: grayscale(1) brightness(.75); }
.theme-card .lock { position: absolute; left: 50%; top: 44px; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: var(--sheet); display: grid; place-items: center; box-shadow: var(--shadow); }
.theme-card b { font-size: .95rem; } .theme-card small { color: var(--ink-2); font-size: .78rem; line-height: 1.3; }
.sw.th-default::before { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; }
.unlock-card { display: grid; gap: 10px; justify-items: center; margin: 4px 0 6px; padding: 14px; border-radius: 14px; background: var(--lamp-soft); border: 2px solid var(--lamp); text-align: center; }
.unlock-card .sw { width: 180px; height: 90px; border-radius: 12px; position: relative; overflow: hidden; box-shadow: var(--shadow); } .unlock-card .sw::before { content: ""; position: absolute; inset: 0; }

.eyebrow.fin { color: var(--fin); } .bar.fin i { background: var(--fin); } .dot.fin { background: var(--fin); } .subj.fin { --c: var(--fin); } .vplayer.fin { --c: #F5C97A; }

/* reading, spelling & writing */
.lit-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.lit-card { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow); min-width: 0; }
.lit-card h3 { margin: 0; }
.lit-card .btn { justify-self: start; }
.lit-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font: 800 1.2rem var(--f-display); color: #fff; background: var(--ela); }
.lit-card.read .lit-ico { background: var(--sci); } .lit-card.write .lit-ico { background: var(--soc); font-size: 1.4rem; }
.book-ico { width: 20px; height: 16px; border: 3px solid #fff; border-radius: 2px 2px 4px 4px; position: relative; }
.book-ico::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 3px solid #fff; transform: translateX(-50%); }
.lit-head { margin: 12px 0 18px; display: grid; gap: 8px; }
.lit-head h1 { margin: 0; }
.tricky-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.tricky-card h3 { margin: 0 0 4px; }
.spell-lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.spell-list { display: grid; gap: 8px; align-content: start; }
.spell-list h3 { margin: 0; }
.sl-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.study-words { list-style: none; padding: 0; margin: 0 0 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.sw-btn { width: 100%; text-align: left; display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); color: var(--ink); font: inherit; cursor: pointer; }
.sw-btn b { font-size: 1.25rem; letter-spacing: .02em; }
.sw-btn:hover { border-color: var(--ela); }
.spell-play { max-width: 680px; margin: 0 auto; display: grid; gap: 12px; }
.spell-card { display: grid; gap: 16px; padding: 24px; }
.sp-audio { display: flex; gap: 10px; flex-wrap: wrap; }
.sp-sentence { font-size: 1.25rem; line-height: 1.5; margin: 0; }
.sp-flash { font: 800 2.4rem var(--f-display); letter-spacing: .06em; margin: 0; text-align: center; }
.sp-hint { font: 700 1.4rem/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .1em; margin: 0; color: var(--ink-2, var(--ink)); }
.sp-form { display: flex; gap: 10px; flex-wrap: wrap; }
.sp-input { flex: 1 1 220px; font-size: 1.6rem !important; letter-spacing: .06em; padding: 10px 14px !important; }
.sp-ok { margin: 0; font: 700 1.2rem var(--f-display); color: var(--good); }
.sp-wrong { background: var(--bad-bg); border-radius: 12px; padding: 12px 16px; }
.sp-wrong p { margin: 4px 0; }
.sp-try { font: 700 1.3rem ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; }
.sp-try .bad { color: var(--bad); text-decoration: underline wavy; }
.sp-right { font: 800 1.5rem ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; color: var(--good); }
.missed ul.chips, ul.chips { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
ul.chips .chip-word { padding: 4px 10px; border-radius: 99px; border: 1px solid var(--rule); font-size: .9rem; }
.card ul.chips { justify-content: flex-start; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.fin-box { display: flex; align-items: flex-end; padding-bottom: 8px; }
.shelf { list-style: none; padding: 8px 0 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; border-bottom: 6px solid var(--rule); }
.spine { --sp: var(--ela); background: var(--sp); color: #fff; border-radius: 4px 4px 0 0; padding: 10px 8px; width: 56px; min-height: 130px; writing-mode: vertical-rl; transform: rotate(180deg); display: flex; gap: 6px; overflow: hidden; }
.spine b { font-size: .82rem; } .spine small { font-size: .7rem; opacity: .85; }
.read-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.read-list li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.read-note { flex-basis: 100%; margin: 0; color: var(--ink-3); }
.prompt-box { background: var(--paper); border: 1px dashed var(--rule); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
.prompt-box .prompt { font: 600 1.15rem/1.4 var(--f-display); margin: 4px 0 8px; }
.journal-form textarea { font-size: 1.1rem; line-height: 1.6; }
.jr-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 6px; }

.es-pic.dots { grid-template-columns: repeat(5, 14px); gap: 6px; min-height: 48px; } .es-pic.big.dots { grid-template-columns: repeat(5, 22px); gap: 8px; }
.es-pic.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--soc); } .es-pic.big.dots i { width: 22px; height: 22px; }
.es-peek { display: flex; gap: 8px; align-items: center; } .es-peek .es-pic.emoji { font-size: 1.8rem; } .es-peek .es-pic.swatch { width: 28px; height: 28px; } .es-peek .es-pic.dots { grid-template-columns: repeat(5, 6px); gap: 3px; min-height: 0; } .es-peek .es-pic.dots i { width: 6px; height: 6px; }
.es-prompt { margin: 0; font-weight: 700; color: var(--ink-2); }

.mic-row { justify-content: center; } .btn.mic { font-size: 1.1rem; padding: 12px 22px; } .btn.mic.on { animation: pulse 1.2s infinite; }

.plan-today h2 { margin: 2px 0 0; } .plan-today.all-done { background: var(--good-bg); }
.plan-meta { display: grid; justify-items: end; } .plan-meta b { font: 800 1.6rem var(--f-display); } .plan-meta small { color: var(--ink-3); max-width: 240px; text-align: right; }
.plan-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.plan-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); flex-wrap: wrap; }

.plan-item.done .tick { background: var(--good); border-color: var(--good); } .plan-item.done .pi-t { color: var(--ink-3); text-decoration: line-through; }
.pi-t { flex: 1 1 200px; } .pi-t small { color: var(--ink-3); }
.fun-picks { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.plan-foot { align-items: center; }
.focus-chip { position: fixed; left: 16px; bottom: 16px; z-index: 60; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 999px; background: var(--ink); color: var(--sheet); box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
.focus-chip.break { background: #C27A12; color: #fff; border-radius: 16px; } .focus-chip.done { background: var(--good); color: #fff; }
.focus-chip .fc-time { font: 800 1.2rem var(--f-display); font-variant-numeric: tabular-nums; }
.focus-chip .btn.ghost { color: inherit; border-color: currentColor; }
.week-card { display: grid; gap: 10px; margin-bottom: 18px; } .week-card h3 { margin: 0; }
.goal-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; } .goal-list li { display: flex; justify-content: space-between; align-items: center; } .goal-list li.done label { text-decoration: line-through; color: var(--ink-3); }
.goal-form { display: flex; gap: 8px; flex-wrap: wrap; } .goal-form input { flex: 1 1 220px; }
.reflect-form h4 { margin: 6px 0 0; } .reflect-form textarea, .explain-box textarea, #wk-note, #con-why { font-family: inherit; }
.explain-box { display: grid; gap: 6px; text-align: left; width: 100%; max-width: 520px; margin: 4px auto; } .explain-box .btn { justify-self: start; }
.explain-q { flex-basis: 100%; color: var(--ink-3); font-style: italic; }
.con-story .con-text { font-size: 1.1rem; line-height: 1.6; } .con-story h3 { margin: 8px 0; }
.con-opts { display: grid; gap: 8px; margin: 8px 0 12px; }
.reflect-view p { margin: 4px 0; }

/* Quests */
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 18px; } .two-col > .card { margin: 0; }
.quest-card { display: grid; gap: 10px; align-content: start; } .quest-card h3 { margin: 0; } .quest-card .btn { justify-self: start; }
.quest-row { display: flex; gap: 12px; align-items: center; } .quest-e { font-size: 2rem; line-height: 1; } .quest-e.big { font-size: 3rem; }
.quest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 18px; }
.quest-pick { display: grid; gap: 6px; align-content: start; } .quest-pick h3 { margin: 4px 0 0; } .quest-pick p { margin: 0; } .quest-pick .btn { justify-self: start; margin-top: 6px; }
.quest-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 14px; } .quest-info h4 { margin: 0 0 6px; }

.qstep { display: grid; gap: 8px; } .qstep.next { border-color: var(--soc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--soc) 30%, transparent); } .qstep.done { background: var(--good-bg); }
.qs-head { display: flex; gap: 12px; align-items: flex-start; } .qs-head p { margin: 2px 0 0; }
.qstep .tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center; font-weight: 800; flex: none; }
.qstep.done .tick { background: var(--good); border-color: var(--good); color: #fff; }
.qs-note { margin: 0; color: var(--ink-2); font-style: italic; }
.qs-form { display: grid; gap: 6px; } .qs-form textarea { font-family: inherit; } .qs-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .qs-row input { width: 110px; }
.show-ready { display: grid; gap: 8px; border-top: 5px solid var(--soc); }
.portfolio { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; } .portfolio li { display: flex; gap: 12px; } .portfolio p { margin: 2px 0; }
.qnotes li { margin: 4px 0; } .show-fb textarea { font-family: inherit; }

<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* Lantern Homeschool — curriculum content, grades 1–4.
   Quiz format: [question, correctAnswer, wrong1, wrong2, wrong3]  (choices are shuffled at runtime)
   Math units use a generator id (g) so every quiz attempt gets fresh problems. */
(function () {
  const KA = 'https://www.khanacademy.org/';
  const C = (window.LH_COURSES = window.LH_COURSES || {});

  /* ───────────── GRADE 1 ───────────── */
  C['1-math'] = {
    t: '1st Grade Math', r: [['Khan Academy · 1st grade math', KA + 'math/cc-1st-grade-math']],
    u: [
      { t: 'Numbers to 120 and place value', g: 'placeValue1',
        l: ['A two-digit number is made of tens and ones. In 47 there are 4 tens and 7 ones.', 'Ten ones make one ten. Bundle 10 sticks with a rubber band and you have 1 ten.', 'Count forward from any number up to 120: …98, 99, 100, 101…'],
        try: 'Grab beans or coins. Make 34 using groups of ten and loose ones.' },
      { t: 'Addition within 20', g: 'add20',
        l: ['Adding puts groups together. 8 + 5 means start at 8 and count on 5 more.', 'Make a ten: 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.', 'Order does not change the sum: 3 + 9 = 9 + 3.'],
        try: 'Roll two dice and add the dots. Do it ten times.' },
      { t: 'Subtraction within 20', g: 'sub20',
        l: ['Subtracting takes away or finds the difference. 15 − 6 means start at 15 and take away 6.', 'Think addition: 15 − 6 = ? is the same as 6 + ? = 15.', 'Count back on a number line when the number taken away is small.'],
        try: 'Put 14 crackers out. Eat 5. How many are left?' },
      { t: 'Comparing numbers', g: 'compare1',
        l: ['Compare tens first. 52 is greater than 38 because 5 tens is more than 3 tens.', 'If the tens are the same, compare the ones: 46 > 43.', 'Symbols: > means greater than, < means less than, = means equal.'],
        try: 'Write two numbers on cards. Who has the greater number?' },
      { t: 'Telling time to the hour and half hour', g: 'time1',
        l: ['The short hand shows the hour. The long hand shows the minutes.', 'At "o\'clock" the long hand points to 12. At "half past" it points to 6.', '3:30 is half past 3. One hour after 3:30 is 4:30.'],
        try: 'Check a clock at breakfast, lunch and dinner and say the time out loud.' }
    ]
  };
  C['1-ela'] = {
    t: '1st Grade Reading & Writing', r: [['Starfall · Learn to Read (free)', 'https://www.starfall.com/h/learn-to-read/'], ['Storyline Online · read-alouds', 'https://storylineonline.net/library']],
    u: [
      { t: 'Short vowel sounds', r: [['Starfall · Learn to Read', 'https://www.starfall.com/h/learn-to-read/']],
        l: ['The vowels are a, e, i, o, u. In short words like cat, bed, pig, hot and sun, vowels make their short sound.', 'Tap each sound and blend it: c-a-t → cat.', 'Change one letter to make a new word: cat → cap → map.'],
        try: 'Make words with letter tiles: change the vowel in b_g to make bag, beg, big, bog, bug.',
        q: [['Which word has a short a sound?', 'hat', 'hit', 'hot', 'hut'], ['Which word rhymes with "pig"?', 'dig', 'pan', 'pet', 'pot'], ['What word do you get when you blend s-u-n?', 'sun', 'sin', 'son', 'sat']] },
      { t: 'Sight words', r: [['Starfall · It\'s Fun to Read', 'https://www.starfall.com/h/fun-to-read/']],
        l: ['Sight words show up in almost every book: the, said, was, you, they, have, of.', 'Many sight words do not follow the usual sound rules, so we learn them by heart.', 'Read them fast, spell them, and use them in a sentence.'],
        try: 'Write 5 sight words on sticky notes around the house. Read each one when you pass it.',
        q: [['Which is spelled correctly?', 'said', 'sed', 'siad', 'sayd'], ['Fill in the blank: "___ dog is big."', 'The', 'Of', 'Was', 'Have'], ['Which word is a sight word?', 'they', 'zap', 'mud', 'fin']] },
      { t: 'Characters and setting', r: [['Storyline Online · Stellaluna', 'https://storylineonline.net/books/stellaluna']],
        l: ['Characters are the people or animals in a story.', 'The setting is where and when the story happens.', 'Good readers ask: Who is in the story? Where are they?'],
        try: 'Listen to "Stellaluna" on Storyline Online. Name the main character and two places she goes.',
        q: [['What is the setting of a story?', 'Where and when it happens', 'Who is in the story', 'The title', 'The last page'], ['In "The Three Little Pigs," which is a character?', 'The wolf', 'The straw house', 'The forest', 'The end'], ['A story says "Long ago, in a snowy village…" What does this tell you?', 'The setting', 'The problem', 'The lesson', 'The author']] },
      { t: 'Writing a sentence',
        l: ['A sentence is a complete thought. It tells who and what happened.', 'Start every sentence with a capital letter.', 'End a telling sentence with a period and an asking sentence with a question mark.'],
        try: 'Write three sentences about your favorite food. Check each one for a capital and an end mark.',
        q: [['Which sentence is written correctly?', 'My cat likes to nap.', 'my cat likes to nap.', 'My cat likes to nap', 'my cat likes to nap'], ['Which end mark goes here: "Where is my hat__"', '?', '.', ',', '!'], ['Which is a complete sentence?', 'The bird sang.', 'The bird.', 'Sang a song.', 'Up in the tree.']] },
      { t: 'Retelling a story', r: [['Storyline Online · The Empty Pot', 'https://storylineonline.net/books/the-empty-pot']],
        l: ['Retelling means telling a story again in your own words.', 'Tell the beginning, the middle and the end in order.', 'Use order words: first, next, then, last.'],
        try: 'Watch "The Empty Pot" and retell it to a grown-up using first, next, then, last.',
        q: [['Which words help you retell in order?', 'First, next, last', 'Big, small, tall', 'Red, blue, green', 'Yes, no, maybe'], ['What part of a story usually has the problem solved?', 'The end', 'The title', 'The cover', 'The beginning'], ['Retelling means…', 'Telling the story again in your own words', 'Reading only the title', 'Drawing the cover', 'Skipping to the end']] }
    ]
  };
  C['1-sci'] = {
    t: '1st Grade Science', r: [['NASA Space Place', 'https://spaceplace.nasa.gov/'], ['PhET simulations', 'https://phet.colorado.edu/']],
    u: [
      { t: 'Living and nonliving things',
        l: ['Living things grow, need food and water, and make more of their own kind.', 'Nonliving things, like rocks and toys, do not grow or need food.', 'Plants are living even though they do not move around.'],
        try: 'Go outside and list 5 living and 5 nonliving things you see.',
        q: [['Which is a living thing?', 'A tree', 'A rock', 'A spoon', 'A cloud'], ['What do all living things need?', 'Water', 'Toys', 'Shoes', 'Electricity'], ['Which can grow?', 'A puppy', 'A ball', 'A chair', 'A pencil']] },
      { t: 'What plants need',
        l: ['Plants need sunlight, water, air and space to grow.', 'Roots take in water. Leaves use sunlight to make food.', 'A plant kept in a dark closet will turn pale and weak.'],
        try: 'Plant two bean seeds in cups. Put one by a window and one in a cupboard. Check them every day for a week.',
        q: [['Which part of a plant takes in water?', 'Roots', 'Flowers', 'Leaves', 'Seeds'], ['What do leaves use to make food?', 'Sunlight', 'Rocks', 'Sand', 'Wind only'], ['A plant in a dark closet will likely…', 'Grow weak and pale', 'Grow faster', 'Turn purple', 'Make more flowers']] },
      { t: 'Animals and their young',
        l: ['Young animals look a lot like their parents, but not exactly the same.', 'Parents help young survive: birds feed chicks, a cat carries kittens.', 'Some young look very different at first, like a tadpole that becomes a frog.'],
        try: 'Match baby animal pictures to their parents: calf, kitten, chick, tadpole.',
        q: [['A baby frog is called a…', 'Tadpole', 'Cub', 'Calf', 'Kid'], ['How do bird parents help their chicks?', 'They bring them food', 'They teach them to swim right away', 'They leave them alone', 'They build cars'], ['A young cow is called a…', 'Calf', 'Puppy', 'Foal', 'Chick']] },
      { t: 'Patterns in the sky', r: [['NASA Space Place · Moon phases', 'https://spaceplace.nasa.gov/moon-phases/en/']],
        l: ['The Sun seems to rise in the east and set in the west every day.', 'The Moon\'s shape seems to change over about a month. These are its phases.', 'In summer there are more hours of daylight than in winter.'],
        try: 'Draw the Moon every clear night for two weeks. How does it change?',
        q: [['Where does the Sun appear to rise?', 'East', 'West', 'North', 'Under the ground'], ['The changing shapes of the Moon are called…', 'Phases', 'Seasons', 'Stars', 'Clouds'], ['Which season has the most daylight?', 'Summer', 'Winter', 'Fall', 'They are all the same']] },
      { t: 'Sound and light',
        l: ['Sound is made when something vibrates (shakes back and forth quickly).', 'Light lets us see. With no light, we cannot see anything.', 'Some things let light through (glass); some block it and make a shadow (wood).'],
        try: 'Stretch a rubber band over a box and pluck it. Feel it vibrate. Then make shadow puppets with a flashlight.',
        q: [['Sound is made by…', 'Vibrations', 'Shadows', 'Colors', 'Rocks'], ['What makes a shadow?', 'An object blocking light', 'A loud noise', 'Water', 'Wind'], ['Which lets light pass through?', 'A clear window', 'A wooden door', 'A brick', 'A book']] }
    ]
  };
  C['1-soc'] = {
    t: '1st Grade Social Studies', r: [["Ben's Guide to the U.S. Government", 'https://bensguide.gpo.gov/'], ['iCivics · Neighborhood Good', 'https://ed.icivics.org/resources/game/1814/neighborhood-good']],
    u: [
      { t: 'Rules and why we have them',
        l: ['Rules tell us how to act. They keep us safe and help us be fair.', 'Homes, schools and games all have rules.', 'Laws are rules made by the government for everyone.'],
        try: 'Write 3 family rules together and talk about why each one matters.',
        q: [['Why do we have rules?', 'To keep us safe and be fair', 'To make people sad', 'So nobody can play', 'To waste time'], ['A rule made by the government is called a…', 'Law', 'Game', 'Song', 'Story'], ['Which is a safety rule?', 'Look both ways before crossing', 'Eat dessert first', 'Run inside the house', 'Leave toys on stairs']] },
      { t: 'Families and community helpers', r: [['iCivics · Neighborhood Good', 'https://ed.icivics.org/resources/game/1814/neighborhood-good']],
        l: ['A community is a place where people live, work and play together.', 'Community helpers include firefighters, nurses, mail carriers and librarians.', 'Families live in many ways, and every family has members who help each other.'],
        try: 'Pick a community helper. Draw what tools they use for their job.',
        q: [['Who delivers letters?', 'A mail carrier', 'A chef', 'A pilot', 'A dentist'], ['Who helps put out fires?', 'A firefighter', 'A baker', 'A farmer', 'A teacher'], ['A community is…', 'A place where people live and work together', 'Only one house', 'A kind of food', 'A type of weather']] },
      { t: 'Maps and globes',
        l: ['A map is a flat drawing of a place from above. A globe is a round model of Earth.', 'A map key (legend) tells what the symbols mean.', 'Blue on a map usually means water.'],
        try: 'Draw a map of your bedroom with a key for bed, door and window.',
        q: [['What part of a map explains its symbols?', 'The key', 'The title only', 'The border', 'The paper'], ['A round model of Earth is a…', 'Globe', 'Map', 'Ruler', 'Compass'], ['On most maps, blue shows…', 'Water', 'Mountains', 'Roads', 'Cities']] },
      { t: 'Needs and wants',
        l: ['Needs are things we must have to live: food, water, shelter, clothing.', 'Wants are things that are nice to have but we can live without.', 'Families make choices because money is limited.'],
        try: 'Cut pictures from a store flyer and sort them into needs and wants.',
        q: [['Which is a need?', 'Water', 'A video game', 'Candy', 'A toy car'], ['Which is a want?', 'A new toy', 'Food', 'A coat in winter', 'A home'], ['Why do families make choices about what to buy?', 'Money is limited', 'Stores are closed', 'Everything is free', 'Wants are needs']] },
      { t: 'American symbols', r: [["Ben's Guide · Ages 4 to 8", 'https://bensguide.gpo.gov/learning-adventures-14more']],
        l: ['The American flag has 50 stars for the 50 states and 13 stripes for the first 13 colonies.', 'The bald eagle is the national bird.', 'The Statue of Liberty stands for freedom.'],
        try: 'Count the stars and stripes on a flag picture. Then draw your own.',
        q: [['How many stars are on the U.S. flag?', '50', '13', '25', '100'], ['What do the 13 stripes stand for?', 'The first 13 colonies', '13 presidents', '13 lakes', '13 holidays'], ['What is the U.S. national bird?', 'Bald eagle', 'Robin', 'Pigeon', 'Owl']] }
    ]
  };

/* Lantern Homeschool — "Money Smart": a grades 1–12 financial-literacy course.
   Organized around the six areas of the National Standards for Personal Financial Education
   (Earning Income, Spending, Saving, Investing, Managing Credit, Managing Risk), spiraling each year.
   Units with `g` use money-math practice generators (generators-fin.js) for fresh problems every try. */
(function () {
  const C = window.LH_COURSES;
  const R = {
    cfpb: ['CFPB · Money as You Grow', 'https://www.consumerfinance.gov/consumer-tools/money-as-you-grow/'],
    pms: ['Practical Money Skills', 'https://www.practicalmoneyskills.com/'],
    ngpf: ['Next Gen Personal Finance (free)', 'https://www.ngpf.org/'],
    ka: ['Khan Academy · Financial literacy', 'https://www.khanacademy.org/college-careers-more/financial-literacy'],
    acr: ['AnnualCreditReport.com (free credit reports)', 'https://www.annualcreditreport.com/'],
    cee: ['Council for Economic Education · 6 core areas', 'https://www.councilforeconed.org/6-core-areas-of-personal-finance/']
  };
  const course = (g, t, r, u, credit) => { C[g + '-fin'] = credit ? { t, credit, r, u } : { t, r, u }; };

  /* ───────── GRADE 1 ───────── */
  course(1, 'Money Smart: Coins & Choices', [R.cfpb, R.pms], [

    expRules() { const b = pick(['x', 'a', 'y']), m = R(2, 8), n = R(2, 5); return pick([() => S(`Simplify: ${b}${sup(m)} · ${b}${sup(n)}`, `${b}${sup(m + n)}`, [`${b}${sup(m * n)}`, `${b}${sup(m - n)}`, `2${b}${sup(m + n)}`]), () => S(`Simplify: (${b}${sup(m)})${sup(n)}`, `${b}${sup(m * n)}`, [`${b}${sup(m + n)}`, `${b}${sup(m)}`, `${n}${b}${sup(m)}`]), () => S(`Simplify: ${b}${sup(m + n)} ÷ ${b}${sup(n)}`, `${b}${sup(m)}`, [`${b}${sup(m + 2 * n)}`, `${b}${sup(n)}`, `${b}${sup(m * n)}`]), () => S(`What is 7⁰?`, '1', ['0', '7', '70'])])(); },
    factorQuad() { let p = R(-7, 7) || 2, q = R(-7, 7) || -3; const b = p + q, c = p * q; const term = (v) => (v < 0 ? ` − ${Math.abs(v)}` : ` + ${v}`); const sol = (a, b2) => `x = ${neg(a)} or x = ${neg(b2)}`; return S(`Solve: x²${b ? term(b) + 'x' : ''}${c ? term(c) : ''} = 0`, sol(-p, -q), [sol(p, q), sol(-p, q), sol(p + 1, q - 1)]); },
    /* Geometry */
    triAngle() { const a = R(25, 90), b = R(20, 160 - a); return N(`A triangle has angles of ${a}° and ${b}°. What is the third angle?`, 180 - a - b, 5, { f: (v) => v + '°', offs: [5, -5, 10, 360 - a - b - (180 - a - b)] }); },
    distance() { const t = pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17]]); const x1 = R(-4, 4), y1 = R(-4, 4); return N(`What is the distance between (${neg(x1)}, ${neg(y1)}) and (${neg(x1 + t[0])}, ${neg(y1 + t[1])})?`, t[2], 1, { offs: [t[0] + t[1] - t[2], 1, -1, 2] }); },
    similar() { const a = R(3, 9), b = R(4, 12), k = R(2, 4); return N(`Two triangles are similar. A side of ${a} cm matches a side of ${a * k} cm. Another side of the small triangle is ${b} cm. How long is the matching side of the large triangle?`, b * k, k, { f: (v) => v + ' cm', offs: [a * k - a, k, -k, b] }); },
    trig() { const t = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25]]); const f = pick(['sin', 'cos', 'tan']); const ans = f === 'sin' ? `${t[0]}/${t[2]}` : f === 'cos' ? `${t[1]}/${t[2]}` : `${t[0]}/${t[1]}`; return S(`In a right triangle, angle A is opposite a side of ${t[0]}, the adjacent leg is ${t[1]} and the hypotenuse is ${t[2]}. What is ${f} A?`, ans, [`${t[0]}/${t[2]}`, `${t[1]}/${t[2]}`, `${t[0]}/${t[1]}`, `${t[1]}/${t[0]}`, `${t[2]}/${t[0]}`]); },
    /* Chemistry */
    balance() { return pick([
      () => S('Balance: __H₂ + O₂ → 2H₂O. What coefficient goes in front of H₂?', '2', ['1', '3', '4']),
      () => S('Balance: CH₄ + __O₂ → CO₂ + 2H₂O. What coefficient goes in front of O₂?', '2', ['1', '3', '4']),
      () => S('Balance: N₂ + __H₂ → 2NH₃. What coefficient goes in front of H₂?', '3', ['1', '2', '6']),
      () => S('Balance: 2Na + Cl₂ → __NaCl. What coefficient goes in front of NaCl?', '2', ['1', '3', '4']),
      () => S('Balance: __Fe + 3O₂ → 2Fe₂O₃. What coefficient goes in front of Fe?', '4', ['2', '3', '6']),
      () => S('Balance: C₃H₈ + __O₂ → 3CO₂ + 4H₂O. What coefficient goes in front of O₂?', '5', ['3', '4', '10'])])(); },
    moles() { const s = pick([['water (H₂O, 18 g/mol)', 18], ['carbon dioxide (CO₂, 44 g/mol)', 44], ['sodium chloride (NaCl, 58.5 g/mol)', 58.5], ['oxygen gas (O₂, 32 g/mol)', 32]]); const n = pick([0.5, 1, 2, 3, 4]); return N(`How many moles are in ${fmt(s[1] * n)} g of ${s[0]}?`, n, 1, { f: (v) => fmt(v) + ' mol', offs: [1, -0.5, 0.5, 2], min: 0.25 }); },
    /* Algebra 2 */
    discriminant() { const a = R(1, 3), b = R(-8, 8), c = R(-6, 9); const D = b * b - 4 * a * c; const ans = D > 0 ? '2 real solutions' : D === 0 ? '1 real solution' : '0 real solutions'; const tm = (v, x) => (v ? (v < 0 ? ` − ${Math.abs(v)}${x}` : ` + ${v}${x}`) : ''); return S(`How many real solutions does ${a === 1 ? '' : a}x²${tm(b, 'x')}${tm(c, '')} = 0 have?`, ans, ['2 real solutions', '1 real solution', '0 real solutions', '3 real solutions']); },
    polyEval() { const a = R(1, 3), b = R(-5, 5), c = R(-9, 9), x = R(-3, 3); const v = a * x * x * x + b * x + c; const tm = (k, s) => (k ? (k < 0 ? ` − ${Math.abs(k)}${s}` : ` + ${k}${s}`) : ''); return N(`If f(x) = ${a === 1 ? '' : a}x³${tm(b, 'x')}${tm(c, '')}, what is f(${neg(x)})?`, v, 2, { f: neg, offs: [2, -2, -2 * c, 2 * b * x, 1] }); },
    expGrowth() { const p = pick([50, 100, 200, 500]), n = R(2, 6); return N(`A population of ${p} bacteria doubles every hour. How many are there after ${n} hours?`, p * Math.pow(2, n), p, { offs: [p * Math.pow(2, n - 1), -p * Math.pow(2, n - 1), p * n * 2 - p * Math.pow(2, n), p] }); },
    logEval() { const b = pick([2, 3, 5, 10]), k = R(1, b === 10 ? 5 : 5); const val = Math.pow(b, k); return Math.random() < 0.5 ? N(`What is log${'₀₁₂₃₄₅₆₇₈₉'[b] && b < 10 ? '₀₁₂₃₄₅₆₇₈₉'[b] : '₁₀'} ${val.toLocaleString('en-US')}?`, k, 1, { offs: [1, -1, 2, val / b - k], min: 0 }) : N(`Solve: ${b}ˣ = ${val.toLocaleString('en-US')}`, k, 1, { f: (v) => 'x = ' + v, offs: [1, -1, 2], min: 0 }); },
    complexI() { const n = R(5, 40); const map = ['1', 'i', '−1', '−i']; return S(`Simplify i${sup(n)}.`, map[n % 4], map.filter((_, i) => i !== n % 4)); },
    /* Physics */
    kinematics() { return pick([() => { const d = R(20, 200), t = R(2, 20); return N(`A cyclist travels ${d * t} m in ${t} s. What is the average speed?`, d, 5, { f: (v) => v + ' m/s', offs: [5, -5, 10, d * t - d - t] }); }, () => { const a = R(2, 6), t = R(2, 8); return N(`A car accelerates from rest at ${a} m/s² for ${t} s. How far does it travel? (d = ½at²)`, 0.5 * a * t * t, 2, { f: (v) => fmt(v) + ' m', offs: [0.5 * a * t * t, a * t - 0.5 * a * t * t, 2, -2] }); }, () => { const v1 = R(0, 10), v2 = v1 + R(4, 30), t = R(2, 4); return N(`A runner speeds up from ${v1} m/s to ${v2} m/s in ${t} s. What is the acceleration?`, (v2 - v1) / t, 1, { f: (v) => fmt(v) + ' m/s²', offs: [1, -1, v2 / t - (v2 - v1) / t + 0.5, 2] }); }])(); },
    forceFma() { return Math.random() < 0.5 ? (() => { const m = R(2, 50), a = R(1, 10); return N(`What net force accelerates a ${m} kg object at ${a} m/s²?`, m * a, 5, { f: (v) => v + ' N', offs: [m + a - m * a, 5, -5, 10] }); })() : (() => { const m = R(2, 80); return N(`What is the weight of a ${m} kg object on Earth? (g = 9.8 m/s²)`, m * 9.8, 9.8, { f: (v) => fmt(v) + ' N', offs: [m - m * 9.8, 9.8, -9.8, 1] }); })(); },
    energy() { return pick([() => { const m = R(1, 20), v = R(2, 12); return N(`What is the kinetic energy of a ${m} kg object moving at ${v} m/s? (KE = ½mv²)`, 0.5 * m * v * v, 10, { f: (x) => fmt(x) + ' J', offs: [0.5 * m * v * v, m * v - 0.5 * m * v * v, 10, -10] }); }, () => { const m = R(1, 20), h = R(2, 20); return N(`What is the potential energy of a ${m} kg object ${h} m high? (PE = mgh, g = 9.8)`, m * 9.8 * h, 10, { f: (x) => fmt(x) + ' J', offs: [m * h - m * 9.8 * h, 9.8, -9.8, 98] }); }, () => { const m = R(1, 20), v = R(2, 15); return N(`What is the momentum of a ${m} kg object moving at ${v} m/s?`, m * v, 5, { f: (x) => x + ' kg·m/s', offs: [0.5 * m * v * v - m * v, 5, -5, m] }); }])(); },
    waves() { if (Math.random() < 0.5) { const f = pick([100, 200, 250, 440, 500]), l = pick([0.5, 1, 1.5, 2]); return N(`A wave has frequency ${f} Hz and wavelength ${l} m. What is its speed?`, f * l, 50, { f: (v) => fmt(v) + ' m/s', offs: [f / l - f * l, 50, -50, 100] }); } const t = R(2, 9); return N(`Thunder arrives ${t} s after lightning. About how far away was the strike? (sound ≈ 343 m/s)`, 343 * t, 343, { f: (v) => v.toLocaleString('en-US') + ' m', offs: [343, -343, 100, -100] }); },
    ohm() { const I = pick([0.5, 1, 1.5, 2, 3, 4]), Rr = pick([2, 4, 5, 6, 10, 12, 20]); return pick([() => N(`A ${Rr} Ω resistor carries ${I} A. What is the voltage across it?`, I * Rr, 2, { f: (v) => fmt(v) + ' V', offs: [Rr / I - I * Rr, 2, -2, 1] }), () => N(`A ${fmt(I * Rr)} V battery is connected to a ${Rr} Ω resistor. What is the current?`, I, 0.5, { f: (v) => fmt(v) + ' A', offs: [0.5, -0.5, 1, Rr], min: 0.25 }), () => N(`A device draws ${I} A at ${fmt(I * Rr)} V. What is its power?`, I * I * Rr, 2, { f: (v) => fmt(v) + ' W', offs: [I * Rr - I * I * Rr + 1, 2, -2, I] })])(); },
    /* Precalculus */
    compose() { const a = R(2, 5), b = R(-5, 5), x = R(-3, 4); const g = x * x, f = a * g + b; return N(`If f(x) = ${a}x ${b < 0 ? '−' : '+'} ${Math.abs(b)} and g(x) = x², what is f(g(${neg(x)}))?`, f, 2, { f: neg, offs: [(a * x + b) * (a * x + b) - f, 2, -2, a] }); },
    radDeg() { const pairs = [[30, 'π/6'], [45, 'π/4'], [60, 'π/3'], [90, 'π/2'], [120, '2π/3'], [135, '3π/4'], [150, '5π/6'], [180, 'π'], [270, '3π/2'], [360, '2π']]; const p = pick(pairs); const others = pairs.filter((x) => x !== p).sort(() => Math.random() - 0.5).slice(0, 3); if (Math.random() < 0.5) return S(`Convert ${p[0]}° to radians.`, p[1], others.map((x) => x[1])); return S(`Convert ${p[1]} radians to degrees.`, p[0] + '°', others.map((x) => x[0] + '°')); },
    unitCircle() { const t = pick([['sin 30°', '1/2'], ['cos 30°', '√3/2'], ['sin 45°', '√2/2'], ['cos 60°', '1/2'], ['sin 60°', '√3/2'], ['sin 90°', '1'], ['cos 90°', '0'], ['cos 180°', '−1'], ['sin 150°', '1/2'], ['cos 120°', '−1/2'], ['tan 45°', '1'], ['sin 270°', '−1']]); return S(`What is ${t[0]}?`, t[1], ['1/2', '√3/2', '√2/2', '1', '0', '−1', '−1/2', '√3']); },
    sequence() { if (Math.random() < 0.5) { const a = R(-5, 10), d = R(2, 7), n = R(8, 25); return N(`An arithmetic sequence starts ${a}, ${a + d}, ${a + 2 * d}, … What is term ${n}?`, a + (n - 1) * d, d, { f: neg, offs: [d, -d, 2 * d] }); } const a = R(1, 4), r = pick([2, 3]), n = R(4, 7); return N(`A geometric sequence starts ${a}, ${a * r}, ${a * r * r}, … What is term ${n}?`, a * Math.pow(r, n - 1), a, { offs: [a * Math.pow(r, n) - a * Math.pow(r, n - 1), a * Math.pow(r, n - 2) - a * Math.pow(r, n - 1), a] }); },
    compound() { const P = pick([500, 1000, 2000, 5000]), r = pick([0.04, 0.05, 0.06, 0.08]), t = pick([2, 3, 5, 10]); const A = P * Math.pow(1 + r, t); const simple = P * (1 + r * t); const f = (v) => '$' + Math.round(v).toLocaleString('en-US'); return S(`You invest ${f(P)} at ${Math.round(r * 100)}% interest, compounded yearly. About how much will you have after ${t} years?`, f(A), [f(simple), f(P * r * t), f(A + P * r)]); }
  };

  /* ───────── Pictures for existing practice + new unit generators (inserted into generators.js) ───────── */
  const VV = (o, v) => { o.v = v; return o; };
  const ICONS = ['apple', 'star', 'ball', 'fish', 'heart'];
  const tstr = (h, m) => h + ':' + String(m).padStart(2, '0');
  const wrapH = (h) => ((h - 1 + 120) % 12) + 1;
  const NAMES = ['Ana', 'Ben', 'Cruz', 'Dev', 'Eli', 'Fay', 'Gus'];
  Object.assign(G, {
    /* — existing units, now with pictures — */
    add20() { const a = R(1, 10), b = R(1, 10); return VV(N(`${a} + ${b} = ?`, a + b, 1, { min: 0 }), { t: 'count', groups: [a, b], icon: pick(ICONS) }); },
    sub20() { const a = R(5, 15), b = R(1, a - 1); return VV(N(`${a} − ${b} = ?`, a - b, 1, { min: 0 }), { t: 'count', groups: [a, b], op: '−', icon: pick(ICONS) }); },
    placeValue1() { const t = R(1, 9), o = R(0, 9), n = t * 10 + o; return Math.random() < 0.5 ? VV(N(`How many tens are in ${n}?`, t, 1, { min: 0 }), { t: 'base10', tens: t, ones: o }) : VV(N('What number do these blocks show?', n, 10, { min: 0, offs: [1, -1, 10, -10, 9] }), { t: 'base10', tens: t, ones: o }); },
    placeValue2() { const h = R(1, 4), t = R(0, 9), o = R(0, 9), n = h * 100 + t * 10 + o; return VV(S('What number do these blocks show?', String(n), [String(h * 100 + o * 10 + t), String(h * 10 + t * 100 + o), String(n + 100), String(n + 10)]), { t: 'base10', h, tens: t, ones: o }); },
    time1() { const h = R(1, 12), half = Math.random() < 0.5; return VV(S('What time does the clock show?', tstr(h, half ? 30 : 0), [tstr(h, half ? 0 : 30), tstr(wrapH(h + 1), half ? 30 : 0), tstr(wrapH(h - 1), half ? 30 : 0), tstr(6, h === 6 ? 15 : 0)]), { t: 'clock', h, m: half ? 30 : 0 }); },
    skipCount() { const step = pick([2, 5, 10]), s = step * R(0, 4), seq = [s, s + step, s + 2 * step]; return VV(N(`Skip count by ${step}s: ${seq.join(', ')}, ?`, s + 3 * step, step, { offs: [1, -1, step, -step, 2 * step], min: 0 }), { t: 'nline', min: s, max: s + 4 * step, step, hops: [[s, s + step], [s + step, s + 2 * step], [s + 2 * step, s + 3 * step]], q: s + 3 * step }); },
    money() { const q = R(0, 3), d = R(0, 4), n = R(0, 2), p = R(0, 4); const total = q * 25 + d * 10 + n * 5 + p; if (total < 2) return G.money(); const coins = [].concat(Array(q).fill(25), Array(d).fill(10), Array(n).fill(5), Array(p).fill(1)); return VV(N('How much money is this?', total, 5, { min: 1, f: (v) => v + '¢' }), { t: 'coins', coins }); },
    oddEven() { const n = R(3, 20); return VV(S(`There are ${n} socks. Is ${n} odd or even?`, n % 2 ? 'Odd' : 'Even', [n % 2 ? 'Even' : 'Odd', 'Both', 'Neither']), { t: 'pairs', n }); },
    mult10() { if (Math.random() < 0.4) { const a = R(6, 10), b = R(2, 10); return N(`${a} × ${b} = ?`, a * b, a, { min: 0, offs: [a, -a, b, -b, 1, -1] }); } const a = R(2, 5), b = R(2, 9); return VV(N(`${a} rows of ${b}. How many in all? (${a} × ${b})`, a * b, a, { min: 0, offs: [a, -a, b, -b, 1, -1] }), { t: 'array', r: a, c: b }); },
    div10() { if (Math.random() < 0.4) { const a = R(6, 10), b = R(2, 10); return N(`${a * b} ÷ ${a} = ?`, b, 1, { min: 1 }); } const a = R(2, 5), b = R(2, 8); return VV(N(`${a * b} stars are put in ${a} equal rows. How many are in each row?`, b, 1, { min: 1 }), { t: 'array', r: a, c: b, icon: 'star' }); },
    round() { if (Math.random() < 0.5) { const n = R(11, 989), lo = Math.floor(n / 10) * 10; if (n % 10 === 0) return G.round(); return VV(N(`Round ${n} to the nearest ten.`, Math.round(n / 10) * 10, 10, { offs: [10, -10, 100], min: 0 }), { t: 'nline', min: lo, max: lo + 10, step: 1, marks: [n] }); } const n = R(101, 989), lo = Math.floor(n / 100) * 100; if (n % 100 === 0) return G.round(); return VV(N(`Round ${n} to the nearest hundred.`, Math.round(n / 100) * 100, 100, { offs: [100, -100, 10], min: 0 }), { t: 'nline', min: lo, max: lo + 100, step: 10, marks: [n] }); },
    fracCompare() { let a = R(2, 8), b = R(2, 8); while (b === a) b = R(2, 8); return VV(S(`Which fraction is greater: 1/${a} or 1/${b}?`, `1/${Math.min(a, b)}`, [`1/${Math.max(a, b)}`, 'They are equal', `1/${a + b}`]), { t: 'frac', parts: [[1, a], [1, b]], shape: 'pie' }); },
    areaPerim() { const l = R(2, 9), w = R(2, 6), unit = pick(['ft', 'cm', 'm']); return Math.random() < 0.5 ? VV(N(`What is the area of this rectangle in square ${unit === 'ft' ? 'feet' : unit === 'cm' ? 'centimeters' : 'meters'}?`, l * w, l, { offs: [l + w - l * w, 2 * (l + w) - l * w, 1, -1, w] }), { t: 'rect', w: l, h: w, unit, grid: true }) : VV(N(`What is the perimeter of this rectangle?`, 2 * (l + w), 2, { offs: [l * w - 2 * (l + w), -(l + w), 2, -2], f: (v) => v + ' ' + unit }), { t: 'rect', w: l, h: w, unit }); },
    equivFrac() { const n = R(1, 3), d = R(n + 1, 5), k = R(2, 3); return VV(N(`The bars show equal amounts. ${n}/${d} = ?/${d * k}`, n * k, 1, { min: 1, offs: [1, -1, k, -k, d] }), { t: 'frac', parts: [[n, d], [n * k, d * k]], shape: 'bar', labels: false }); },
    angles() { const a = R(25, 155); return VV(N(`These two angles make a straight line. One is ${a}°. What is the other?`, 180 - a, 10, { f: (v) => v + '°', offs: [10, -10, 90 - (180 - a), 5, -5] }), { t: 'angle', deg: a, straight: true }); },
    volume() { const l = R(2, 8), w = R(2, 5), h = R(2, 6); return VV(N('What is the volume of this box in cubic inches?', l * w * h, l, { offs: [l, -l, w * h, l * w + w * h + l * h - l * w * h] }), { t: 'box', l, w, h, unit: 'in' }); },
    triAreaMean() { if (Math.random() < 0.5) { const b = 2 * R(2, 8), h = R(3, 10); return VV(N('What is the area of this triangle in square meters? (½ × base × height)', (b * h) / 2, 2, { offs: [(b * h) / 2, 1, -1, h] }), { t: 'tri', angles: ['', '', ''], base: `base ${b} m`, height: `height ${h} m` }); } const n = [R(2, 10), R(2, 10), R(2, 10)]; const s = n[0] + n[1] + n[2]; n[2] += (3 - (s % 3)) % 3; const m = (n[0] + n[1] + n[2]) / 3; return VV(N('What is the mean (average) number of books read?', m, 1, { offs: [1, -1, 2, -2, 3] }), { t: 'bars', labels: NAMES.slice(0, 3), values: n, title: 'Books read' }); },
    circle() { const r = R(2, 12); return Math.random() < 0.5 ? VV(N('What is the area of this circle? (Use π ≈ 3.14)', 3.14 * r * r, 1, { f: (v) => fmt(v) + ' cm²', offs: [2 * 3.14 * r - 3.14 * r * r, 3.14 * r - 3.14 * r * r, 3.14 * 4 * r * r - 3.14 * r * r] }), { t: 'circ', r, unit: 'cm' }) : VV(N('What is the circumference of this circle? (Use π ≈ 3.14)', 2 * 3.14 * r, 1, { f: (v) => fmt(v) + ' in', offs: [3.14 * r * r - 2 * 3.14 * r, -3.14 * r, 3.14] }), { t: 'circ', r, unit: 'in' }); },
    probability() { const red = R(1, 6), blue = R(1, 6), green = R(1, 4), t = red + blue + green; return VV(S('You pick one marble without looking. What is the probability it is red?', fr(red, t), [fr(red, t - red), fr(blue, t), fr(green, t), fr(1, 2)]), { t: 'marbles', colors: { red, blue, green } }); },
    pythag() { const t = pick([[3, 4, 5], [5, 12, 13], [6, 8, 10], [8, 15, 17], [9, 12, 15], [7, 24, 25]]); return Math.random() < 0.6 ? VV(N(`The legs of this right triangle are ${t[0]} and ${t[1]}. How long is the hypotenuse?`, t[2], 1, { offs: [t[0] + t[1] - t[2], 1, -1, 2] }), { t: 'rtri', a: t[0], b: t[1], c: '?' }) : VV(N(`A leg is ${t[0]} and the hypotenuse is ${t[2]}. How long is the other leg?`, t[1], 1, { offs: [t[2] + t[0] - t[1], 1, -1, 2] }), { t: 'rtri', a: t[0], b: '?', c: t[2] }); },
